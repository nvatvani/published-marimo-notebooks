      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

03Cstrong\u003Erange\u003C/strong\u003E as the honest message: it shows how far the rate could realistically\nmove. Each pair's scores show how its past forecasts actually turned out. This is not investment advice.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EHow to read the charts.\u003C/strong\u003E The \u003Cstrong\u003Epurple\u003C/strong\u003E line is today's forecast. The shaded purple areas show where the\nrate is expected to be: darkest = core range (50% chance), middle = likely range (80%), lightest = wide\nrange (95%). The \u003Cstrong\u003Ecyan\u003C/strong\u003E dashed line is the forecast published 28 business days ago, which can now be checked\nagainst the \u003Cstrong\u003Ewhite\u003C/strong\u003E actual rate. Underneath, each bar is one day's published forecast once its 28 days had\npassed: \u003Cstrong\u003Egreen\u003C/strong\u003E if it pointed the right way, \u003Cstrong\u003Epink\u003C/strong\u003E if not; above zero means it missed by less than\nassuming \"no change\", below zero by more. The \u003Cstrong\u003Eamber\u003C/strong\u003E and \u003Cstrong\u003Egrey\u003C/strong\u003E lines show how often forecasts pointed\nthe right way over the last year and the last 60 days. Each chart shows the last 60 business days\nand the next 28; click any legend entry to hide or show that element.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "70fe7ac96cbd856c43caf6ce20eb158b", "console": [], "id": "BYtC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"at-a-glance\"\u003EAt a glance\u003C/h2\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EPair\u003C/th\u003E\n\u003Cth\u003ERate 12 Oct\u003C/th\u003E\n\u003Cth\u003EForecast 19 Nov\u003C/th\u003E\n\u003Cth\u003ELikely range (80%)\u003C/th\u003E\n\u003Cth\u003ECheck: forecast made 02 Sep for today\u003C/th\u003E\n\u003Cth\u003ETrack record (last 250 forecasts)\u003C/th\u003E\n\u003C/tr\u003E\n\u003C/thead\u003E\n\u003Ctbody\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cspan style='color:inherit;font-weight:700'\u003EEUR/USD\u003C/span\u003E\u003C/td\u003E\n\u003Ctd\u003E1.1181\u003C/td\u003E\n\u003Ctd\u003E\u003Cspan style='color:inherit;font-weight:700'\u003E1.1184\u003C/span\u003E (+0.03%)\u003C/td\u003E\n\u003Ctd\u003E1.0870 \u2013 1.1508\u003C/td\u003E\n\u003Ctd\u003E1.1585 \u2192 1.1181 (-3.49%) \u00b7 \ud83d\udd3b below range\u003C/td\u003E\n\u003Ctd\u003E\ud83d\udfe1 right way 46% \u00b7 misses +0.3% vs no change\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cspan style='color:inherit;font-weight:700'\u003EEUR/GBP\u003C/span\u003E\u003C/td\u003E\n\u003Ctd\u003E0.8448\u003C/td\u003E\n\u003Ctd\u003E\u003Cspan style='color:inherit;font-weight:700'\u003E0.8450\u003C/span\u003E (+0.02%)\u003C/td\u003E\n\u003Ctd\u003E0.8304 \u2013 0.8567\u003C/td\u003E\n\u003Ctd\u003E0.8593 \u2192 0.8448 (-1.70%) \u00b7 \ud83d\udfe2 within range\u003C/td\u003E\n\u003Ctd\u003E\ud83d\udd34 right way 38% \u00b7 misses +3.0% vs no change\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cspan style='color:inherit;font-weight:700'\u003EEUR/SEK\u003C/span\u003E\u003C/td\u003E\n\u003Ctd\u003E11.1965\u003C/td\u003E\n\u003Ctd\u003E\u003Cspan style='color:inherit;font-weight:700'\u003E11.2062\u003C/span\u003E (+0.09%)\u003C/td\u003E\n\u003Ctd\u003E10.9527 \u2013 11.5100\u003C/td\u003E\n\u003Ctd\u003E11.1617 \u2192 11.1965 (+0.31%) \u00b7 \ud83d\udfe2 within range\u003C/td\u003E\n\u003Ctd\u003E\ud83d\udfe1 right way 52% \u00b7 misses +1.4% vs no change\u003C/td\u003E\n\u003C/tr\u003E\n\u003Ctr\u003E\n\u003Ctd\u003E\u003Cspan style='color:inherit;font-weight:700'\u003EGBP/USD\u003C/span\u003E\u003C/td\u003E\n\u003Ctd\u003E1.3235\u003C/td\u003E\n\u003Ctd\u003E\u003Cspan style='color:inherit;font-weight:700'\u003E1.3230\u003C/span\u003E (-0.04%)\u003C/td\u003E\n\u003Ctd\u003E1.2834 \u2013 1.3625\u003C/td\u003E\n\u0
