      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

03Cstrong\u003Erange\u003C/strong\u003E as the honest message: it shows how far the rate could realistically\nmove. Each pair's scores show how its past forecasts actually turned out. This is not investment advice.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EHow to read the charts.\u003C/strong\u003E The \u003Cstrong\u003Epurple\u003C/strong\u003E line is today's forecast. The shaded purple areas show where the\nrate is expected to be: darkest = core range (50% chance), middle = likely range (80%), lightest = wide\nrange (95%). The \u003Cstrong\u003Ecyan\u003C/strong\u003E dashed line is the forecast published 28 business days ago, which can now be checked\nagainst the \u003Cstrong\u003Ewhite\u003C/strong\u003E actual rate. Underneath, each bar is one day's published forecast once its 28 days had\npassed: \u003Cstrong\u003Egreen\u003C/strong\u003E if it pointed the right way, \u003Cstrong\u003Epink\u003C/strong\u003E if not; above zero means it missed by less than\nassuming \"no change\", below zero by more. The \u003Cstrong\u003Eamber\u003C/strong\u003E and \u003Cstrong\u003Egrey\u003C/strong\u003E lines show how often forecasts pointed\nthe right way over the last year and the last 60 days. Each chart shows the last 60 business days\nand the next 28; click any legend entry to hide or show that element.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "70fe7ac96cbd856c43caf6ce20eb158b", "console": [], "id": "BYtC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"at-a-glance\"\u003EAt a glance\u003C/h2\u003E\n\u003Ctable\u003E\n\u003Cthead\u003E\n\u003Ctr\u003E\n\u003Cth\u003EPair\u003C/th\u003E\n\u003Cth\u003ERate 09 Nov\u003C/th\u003E\n\u003Cth\u003EForecast 17 Dec\u003C/th\u003E\n\u003Cth\u003ELikely range (80%)\u003C/th\u003E\n\u003Cth\u003ECheck: forecast made 30 Sep for today\u003C/th\u003E\n\u003Cth\u003ETrack record (last 250 forecasts)\
